<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="286" viewBox="0 0 1200 286" role="img" aria-labelledby="title desc">
  <title id="title">Find B-Roll workflow</title>
  <desc id="desc">Understand the transcript, route each beat, verify candidates, obtain approval, and place local assets.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10131A"/>
      <stop offset="1" stop-color="#211923"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#746E7D"/>
    </marker>
  </defs>

  <rect width="1200" height="286" rx="24" fill="url(#panel)"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="50" y="50" fill="#FFFFFF" font-size="20" font-weight="700">FROM SPOKEN POINT TO APPROVED VISUAL</text>
    <text x="50" y="77" fill="#AAA5B4" font-size="14">The manifest keeps every source, score, right, choice, and timestamp visible.</text>

    <g transform="translate(50 112)">
      <rect width="192" height="122" rx="17" fill="#FFFFFF" fill-opacity=".045" stroke="#FFFFFF" stroke-opacity=".13"/>
      <circle cx="32" cy="32" r="15" fill="#67D4C1" fill-opacity=".16"/>
      <path d="M24 32H40M27 26H37M27 38H37" stroke="#7CE3D1" stroke-width="2.5" stroke-linecap="round"/>
      <text x="55" y="38" fill="#FFFFFF" font-size="16" font-weight="700">Understand</text>
      <text x="21" y="76" fill="#B8B3C0" font-size="13">Read the full idea,</text>
      <text x="21" y="98" fill="#B8B3C0" font-size="13">not one keyword.</text>
    </g>

    <path d="M252 173H270" stroke="#746E7D" stroke-width="2" marker-end="url(#arrow)"/>

    <g transform="translate(282 112)">
      <rect width="192" height="122" rx="17" fill="#FFFFFF" fill-opacity=".045" stroke="#FFFFFF" stroke-opacity=".13"/>
      <circle cx="32" cy="32" r="15" fill="#FFFFFF" fill-opacity=".07"/>
      <path d="M25 26H39L34 33L39 40H25L30 33Z" fill="none" stroke="#E0DCE4" stroke-width="2"/>
      <text x="55" y="38" fill="#FFFFFF" font-size="16" font-weight="700">Route</text>
      <text x="21" y="76" fill="#B8B3C0" font-size="13">Choose person, UI,</text>
      <text x="21" y="98" fill="#B8B3C0" font-size="13">receipt, or concept.</text>
    </g>

    <path d="M484 173H502" stroke="#746E7D" stroke-width="2" marker-end="url(#arrow)"/>

    <g transform="translate(514 112)">
      <rect width="192" height="122" rx="17" fill="#67D4C1" fill-opacity=".07" stroke="#67D4C1" stroke-opacity=".33"/>
      <circle cx="32" cy="32" r="15" fill="#67D4C1" fill-opacity=".16"/>
      <path d="M24 34L29 39L41 25" fill="none" stroke="#7CE3D1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="55" y="38" fill="#FFFFFF" font-size="16" font-weight="700">Verify</text>
      <text x="21" y="76" fill="#C1D8D4" font-size="13">Check source, match,</text>
      <text x="21" y="98" fill="#C1D8D4" font-size="13">rights, date, and crop.</text>
    </g>

    <path d="M716 173H734" stroke="#746E7D" stroke-width="2" marker-end="url(#arrow)"/>

    <g transform="translate(746 112)">
      <rect width="192" height="122" rx="17" fill="#FF8A70" fill-opacity=".065" stroke="#FF8A70" stroke-opacity=".3"/>
      <circle cx="32" cy="32" r="15" fill="#FF8A70" fill-opacity=".14"/>
      <path d="M25 32L30 37L40 27" fill="none" stroke="#FFAB98" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="55" y="38" fill="#FFFFFF" font-size="16" font-weight="700">Approve</text>
      <text x="21" y="76" fill="#D8C4C0" font-size="13">You choose—or explicitly</text>
      <text x="21" y="98" fill="#D8C4C0" font-size="13">delegate the final pick.</text>
    </g>

    <path d="M948 173H966" stroke="#746E7D" stroke-width="2" marker-end="url(#arrow)"/>

    <g transform="translate(978 112)">
      <rect width="172" height="122" rx="17" fill="#FFFFFF" fill-opacity=".045" stroke="#FFFFFF" stroke-opacity=".13"/>
      <circle cx="32" cy="32" r="15" fill="#FFFFFF" fill-opacity=".07"/>
      <path d="M24 25L41 32L24 39Z" fill="#E0DCE4"/>
      <text x="55" y="38" fill="#FFFFFF" font-size="16" font-weight="700">Place</text>
      <text x="21" y="76" fill="#B8B3C0" font-size="13">Render the approved</text>
      <text x="21" y="98" fill="#B8B3C0" font-size="13">asset on the phrase.</text>
    </g>
  </g>
</svg>
